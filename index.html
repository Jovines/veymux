    <style>
      :root {
        background: #1C1B1A;
        color-scheme: dark light;
      }

      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        background: #1C1B1A;
        color: #CECDC3;
      }

      html[data-theme='light'],
      html[data-theme='light'] body,
      html[data-theme='light'] #root {
        background: #FFFCF0;
        color: #100F0F;
      }

      html[data-theme='light'] {
        color-scheme: light;
      }

      .veymux-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 240px;
        padding: 24px;
        box-sizing: border-box;
        overflow: hidden;
        background: #1C1B1A;
        color: #878580;
        font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .veymux-boot-logo {
        position: absolute;
        top: 50%;
        left: 50%;
        display: block;
        /* Match the native launch image's 30% padding on the short axis. */
        width: 70vmin;
        height: auto;
        pointer-events: none;
        user-select: none;
        transform: translate(-50%, -50%);
      }

      #veymux-startup[hidden] { display: none; }

      /* Keep the launch artwork anchored while the terminal measures its
         viewport or restores keyboard focus. */
      #veymux-startup {
        bottom: auto;
        height: 100vh;
        height: 100lvh;
      }

      .veymux-boot-support {
        position: absolute;
        top: calc(50% + min(28vw, 28vh, 140px) + 32px);
        left: 24px;
        right: 24px;
        text-align: center;
        font-size: 12px;
      }

      .veymux-boot-support p {
        margin: 0 0 8px;
        overflow-wrap: anywhere;
      }

      .veymux-boot-support button {
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid currentColor;
        border-radius: 8px;
        color: inherit;
        background: transparent;
        font: inherit;
        cursor: pointer;
      }

      .veymux-boot-status {
        position: absolute;
        top: calc(50% + min(28vw, 28vh, 140px));
        left: 50%;
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
        opacity: 0;
        transform: translateX(-50%);
        animation: veymux-boot-status-reveal 180ms ease-out 800ms forwards;
      }

      .veymux-boot-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(206, 205, 195, 0.18);
        border-top-color: #879A39;
        border-radius: 9999px;
        animation: veymux-boot-spin 0.9s linear infinite;
      }

      .veymux-boot-error {
        flex-direction: column;
        text-align: center;
      }

      .veymux-boot-error button {
        color: inherit;
        background: transparent;
        border: 1px solid currentColor;
        border-radius: 6px;
        padding: 8px 16px;
        font: inherit;
        cursor: pointer;
      }

      @keyframes veymux-boot-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes veymux-boot-status-reveal {
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .veymux-boot-spinner { animation: none; }
        .veymux-boot-status { animation-duration: 1ms; }
      }

      /* The branded surface bridges the native iOS PWA launch image. A desktop
         refresh has no native launch image to continue, so keep it compact. */
      html[data-veymux-desktop='true'] .veymux-boot-logo {
        display: none;
      }

      html[data-veymux-desktop='true'] .veymux-boot-status {
        top: 50%;
        opacity: 1;
        animation: none;
        transform: translate(-50%, -50%);
      }

      html[data-veymux-desktop='true'] .veymux-boot-support { top: calc(50% + 32px); }

      @media (hover: hover) and (pointer: fine) {
        .veymux-boot-support { top: calc(50% + 32px); }
        .veymux-boot-logo {
          display: none;
        }

        .veymux-boot-status {
          top: 50%;
          opacity: 1;
          animation: none;
          transform: translate(-50%, -50%);
        }
      }

    </style>

    <title>Veymux</title>
    
    <!-- Preload the faces commonly present in the first terminal viewport.
         Preload text and compact prompt icons; other CJK/Nerd ranges load on demand.
         Text faces must settle before xterm opens; loading a bold face afterward
         makes the DOM renderer temporarily rebuild every visible row. -->
    <link rel="preload" href="/fonts/terminal/VeymuxMaple-Regular-ascii-bb380156f566.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="/fonts/terminal/VeymuxMaple-Bold-ascii-c96b47806f3b.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="/fonts/terminal/VeymuxPromptIcons-Regular-icons-01059bd3313c.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="/fonts/terminal/VeymuxPromptIcons-Bold-icons-9a27ea63e10e.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="/fonts/VeymuxStarSymbol-Subset.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="/fonts/NotoSansSymbols2-Subset.woff2" as="font" type="font/woff2" crossorigin="anonymous">

    <!-- Self-hosted terminal fonts.
         统一原则：每个 @font-face 都用 unicode-range 限定字符集，浏览器只在
         实际渲染到该区间时才下载，做到 "全字符覆盖 + 不浪费带宽"。
         字体链通过 :root 上的 --font-terminal / --font-mono 读取，
         单一来源见 src/index.css。 -->
    <style>
      /* Veymux Maple is the primary terminal face. The original JetBrains
         Mono NL Nerd Font Mono remains the UI / Nerd Font / Powerline fallback.
         Their generated unicode-range faces live in terminal/fontFaces.css. */
      /* Veymux Star Symbol —— 从 Menlo Regular 抽取 U+2726/U+2727
         (✦/✧) 的子集。Menlo 是 macOS 上这两个符号与等宽文本视觉大小
         最接近的系统字形，避免手机端走系统符号 fallback 后偏大。

         新增类似“桌面正常、手机偏大/偏小”的自维护符号时：
         1. 先确认本机实际看起来正常的等宽字形来源，优先检查 Menlo：
            fc-list ':charset=<hex>' file family style
            fc-match -v 'Menlo:style=Regular:charset=<hex>'
         2. 不要只信默认 fc-match。它可能返回 Arial Unicode MS，但 Chrome/
            Safari 的 CoreText fallback 不一定等同于 fontconfig 默认结果。
         3. 优先从 Menlo Regular 追加抽取字符到这份子集，并扩展下面的
            unicode-range；避免用 size-adjust 硬调，否则不同设备又会偏大/偏小。
         4. 同步更新 src/index.css 的字体链说明，以及 TerminalViewport.tsx 里的
            TERMINAL_FONT_PRELOADS 文本，确保首帧不会先走系统 fallback。 */
      @font-face {
        font-family: 'Veymux Star Symbol';
        src: url('/fonts/VeymuxStarSymbol-Subset.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        unicode-range: U+2726, U+2727;
      }
      /* Noto Sans Symbols 2 —— 只补足 JetBrains Mono / Nerd Font 都未收录且
         容易被 emoji / 系统符号字体抢走的少数字符：⏸⏹⏺ / ✓✗。
         不覆盖整段 Dingbats，否则 ❖ 等装饰符号会命中 Noto 的大号字形，
         在终端 cell 里显得过大。 */
      @font-face {
        font-family: 'Noto Sans Symbols 2';
        src: url('/fonts/NotoSansSymbols2-Subset.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        unicode-range: U+23F8-23FA, U+2713, U+2717;
      }
      /* Noto Sans Mono CJK SC —— 自托管的等宽中日韩字体子集（GB2312 一级
         常用字 + 中文标点 + 全角区），用于在终端 / UI 中正确渲染 CJK，
         不依赖系统字体可用性。CJK 区由 unicode-range 守住，不会接管拉丁字。
         U+3400-4DBF (CJK Ext A) 和 U+FE30-FE4F (CJK Compat Forms) 在子集
         里为空，不声明，避免无谓的字体回退查找。
         Regular + Bold 两种变体自托管，替代 xterm 合成 bold CJK。 */
    </style>

    <div id="root"></div>
    <script>
      // Keep recovery independent of the module graph: it must work even when
      // an update interrupts loading the entry module or one of its imports.
      var veymuxBootRetryKey = 'veymux-boot-retry';
      var veymuxBootRetryTimer;
      function showVeymuxBootError(event) {
        var root = document.getElementById('veymux-startup');
        if (!root || root.hidden) return;
        var resource = event && event.target;
        var resourceError = resource && resource !== window;
        if (resourceError && resource.tagName !== 'SCRIPT' &&
            !(resource.tagName === 'LINK' && resource.rel === 'stylesheet')) return;
        if (root.querySelector('.veymux-boot-error')) return;
        var chinese = (navigator.language || '').toLowerCase().startsWith('zh');
        var message = event && event.message ? event.message : 'Veymux failed to start.';
        if (event && !event.message && event.reason) {
          message = event.reason && event.reason.message ? event.reason.message : String(event.reason);
        }
        if (resourceError) message = chinese ? '启动资源加载失败。' : 'Startup resources failed to load.';
        var retryCount = 3;
        try {
          var previous = JSON.parse(sessionStorage.getItem(veymuxBootRetryKey) || 'null');
          retryCount = previous && Date.now() - previous.at < 120000 &&
            Number.isInteger(previous.count) && previous.count >= 0 ? previous.count : 0;
          // Write before scheduling so a broken bundle cannot loop forever.
          sessionStorage.setItem(veymuxBootRetryKey, JSON.stringify({ count: retryCount + 1, at: Date.now() }));
        } catch { retryCount = 3; }
        root.textContent = '';
        var errorBox = document.createElement('div');
        errorBox.className = 'veymux-boot veymux-boot-error';
        var text = document.createElement('span');
        text.textContent = message;
        errorBox.appendChild(text);
        var status = document.createElement('span');
        status.textContent = retryCount < 3
          ? (chinese ? '正在等待服务恢复，将自动重试…' : 'Waiting for the service; retrying shortly…')
          : (chinese ? '请稍后重新加载。' : 'Please reload to try again.');
        errorBox.appendChild(status);
        var reload = document.createElement('button');
        reload.type = 'button';
        reload.textContent = chinese ? '重新加载' : 'Reload';
        reload.onclick = function () {
          clearTimeout(veymuxBootRetryTimer);
          try { sessionStorage.removeItem(veymuxBootRetryKey); } catch {}
          window.location.reload();
        };
        errorBox.appendChild(reload);
        root.appendChild(errorBox);
        if (retryCount < 3) veymuxBootRetryTimer = setTimeout(function () {
          // React may have recovered while a nonfatal boot error was displayed.
          var surface = document.getElementById('veymux-startup');
          if (surface && !surface.hidden && surface.querySelector('.veymux-boot-error')) window.location.reload();
        }, 2000 * Math.pow(2, retryCount));
      }
      window.addEventListener('error', showVeymuxBootError, true);
      window.addEventListener('unhandledrejection', showVeymuxBootError);
    </script>
